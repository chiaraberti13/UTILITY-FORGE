name: Bug report
description: Describe an unexpected behaviour and how to reproduce it.
body:
- type: markdown
  attributes:
    value: Report for UTILITY-FORGE. Do not include secrets or personal data. For vulnerabilities, follow
      https://github.com/chiaraberti13/UTILITY-FORGE/security/policy.
- type: textarea
  id: problem
  attributes:
    label: Problem
    description: Describe the observed behaviour and impact.
  validations:
    required: true
- type: textarea
  id: steps
  attributes:
    label: Steps to reproduce
    description: Use a minimal example and synthetic data.
  validations:
    required: true
- type: textarea
  id: expected
  attributes:
    label: Expected result
    description: Explain what should happen.
  validations:
    required: true
- type: textarea
  id: environment
  attributes:
    label: Version and environment
    description: Utility name, browser or PHP version, file format and synthetic sample.
  validations:
    required: true
- type: textarea
  id: evidence
  attributes:
    label: Logs or screenshots
    description: Remove credentials, personal data and confidential information.
  validations:
    required: false
